name: Compilar APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar la firma
        env:
          CLAVE_FIRMA: ${{ secrets.CLAVE_FIRMA }}
        run: |
          if [ -n "$CLAVE_FIRMA" ]; then
            python3 -m venv "$RUNNER_TEMP/firma-venv"
            "$RUNNER_TEMP/firma-venv/bin/pip" install --quiet cryptography
            FILE_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$FILE_PASSWORD"
            "$RUNNER_TEMP/firma-venv/bin/python" -I scripts/derive_signing_key.py "$RUNNER_TEMP/iacamara.p12" "$FILE_PASSWORD"
            echo "IACAMARA_KEYSTORE=$RUNNER_TEMP/iacamara.p12" >> "$GITHUB_ENV"
            echo "IACAMARA_KEYSTORE_PASSWORD=$FILE_PASSWORD" >> "$GITHUB_ENV"
            echo "FIRMA=fija" >> "$GITHUB_ENV"
          else
            echo "::warning::No existe el secreto CLAVE_FIRMA: el APK se firma con una clave temporal."
            echo "FIRMA=temporal" >> "$GITHUB_ENV"
          fi

      - name: Compilar el APK firmado
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Preparar el archivo
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/IA-Camara.apk
          ls -lh out

      - name: Publicar en Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.${{ github.run_number }}"
          if [ "$FIRMA" = "fija" ]; then
            UPDATE_NOTE="Se instala encima de la versión anterior sin perder nada."
          else
            UPDATE_NOTE="Firma temporal: si ya tienes IA Cámara instalada, desinstálala antes de instalar esta versión."
          fi
          printf '%s\n\n%s\n\n%s\n' \
            "APK de IA Cámara compilado automáticamente (rama ${{ github.ref_name }}, commit ${{ github.sha }})." \
            "Para instalar: descarga **IA-Camara.apk** desde el móvil y ábrelo." \
            "$UPDATE_NOTE" > notes.md
          gh release create "$TAG" out/IA-Camara.apk \
            --target "${{ github.sha }}" \
            --title "IA Cámara $TAG" \
            --latest \
            --notes-file notes.md

      - name: Guardar también como artefacto
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: IA-Camara-v0.2.${{ github.run_number }}
          path: out/IA-Camara.apk
          retention-days: 30
